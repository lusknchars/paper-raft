title: "Stochastic Estimation of Transduced Language Models"
authors: ["Vésteinn Snæbjarnarson", "Samuel Kiegeland", "Manuel de Prada Corral", "Ryan Cotterell", "Tim Vieira"]
citation: "Snæbjarnarson, V., Kiegeland, S., de Prada Corral, M., Cotterell, R., & Vieira, T. (2026). Stochastic Estimation of Transduced Language Models. arXiv:2608.27428."
doi: "10.48550/arXiv.2608.27428"
pdf: "papers/transduced-lm-2026.pdf"
pdf_url: "https://arxiv.org/pdf/2608.27428v1"
license: "CC BY-SA 4.0"
brief_url: "https://paperaft.vercel.app/papers/2608.27428/"
experiment: >-
  Prefix probabilities of amino-acid strings under a DNA language model passed through the genetic code
  (§4.3–4.4, Appendix E). Five estimators: beam_summing (the prior work's beam summing) and the four unbiased
  estimators smc_simple, smc_rb, beam_swor and beam_swor_adaptive. Two cases. "worst": the uniform-source
  genetic-code worst case of Appendix E, whose answer is known in closed form. "bigram": a DNA bigram model
  with exact answers from path sums (Appendix D). The paper does not name its DNA corpus or list its targets,
  so the bigram and the three targets here are stand-ins: we test the paper's claims (unbiased, error falls
  with M, beam summing is a lower bound, exactness in the worst case), not its Table 2 numbers. The text
  (WikiText-2 + PTB tokenizer) and GPT-2 experiments are not covered. With the genetic code every covering
  prefix is already a cylinder, so the remainder is always empty: the code paths for remainder entries and
  their stop weights are not exercised here. Nor are the tail roulette for the beam estimators, or
  beam_swor_adaptive's budget shrinking and its m = 0 roulette (with ε = 0 the running total is 0 at every
  prune, so it behaves exactly like beam_swor, as the paper notes for DNA). Reviewers tested those paths with
  their own scripts, outside the graded runs. Method folders: beam-summing, smc-simple, smc-rb, beam-swor,
  beam-swor-adaptive.
metrics:
  - {key: bias, from: max_z, label: "worst bias test", note: "limit 4σ over 128 seeds", agg: max, format: sigma, where: {case: bigram}}
  - {key: error_drop, from: worst_rmse_ratio, label: "error as budget grows", note: "relative RMSE, M 16 → 256, weakest method", agg: max, format: drop_percent, where: {case: bigram}}
  - {key: exact_error, from: max_abs_log_error, label: "exact-case error", note: "log Ẑ vs closed form, limit 1e-9", agg: max, format: sci}
  - {key: lower_bound, from: max_overshoot, label: "beam summing keeps", note: "share of the true value, never above it", agg: max, format: kept_percent}
